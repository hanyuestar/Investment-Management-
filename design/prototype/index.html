<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投资管家 · 原型 v3</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#fff; --line:#e4e8f0; --txt:#1c2536; --sub:#6b7688;
    --primary:#1f3a5f; --accent:#17a2b8; --up:#e2453c; --down:#1c9c5a;
    --shadow:0 1px 3px rgba(20,35,70,.06),0 8px 24px rgba(20,35,70,.06); --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
       background:var(--bg);color:var(--txt);font-size:14px}
  .wrap{max-width:1300px;margin:0 auto;padding:18px}
  .topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    background:linear-gradient(100deg,#1f3a5f,#274c78);color:#fff;padding:14px 18px;border-radius:var(--radius);box-shadow:var(--shadow)}
  .logo{font-size:17px;font-weight:700;letter-spacing:.5px}
  .logo span{opacity:.6;font-weight:400;font-size:12px;margin-left:6px}
  .fxpill{margin-left:auto;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:20px;font-size:12.5px}
  .fxpill b{color:#8fe3ef}
  .topbtns{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:none;border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer;background:#eef2f8;color:var(--txt);transition:.15s;font-weight:500}
  .btn:hover{filter:brightness(.96)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.warn{background:#fdece9;color:#c0392b}
  .btn.ghost{background:rgba(255,255,255,.14);color:#fff}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
  .tabs{display:flex;gap:6px;margin:16px 0 14px;overflow-x:auto;padding-bottom:2px}
  .tab{padding:9px 16px;border-radius:20px;background:#fff;border:1px solid var(--line);cursor:pointer;white-space:nowrap;font-size:13px;color:var(--sub);transition:.15s}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
  .kpi{background:var(--card);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow);min-height:92px}
  .kpi .k{font-size:12px;color:var(--sub);margin-bottom:8px}
  .kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:11.5px;color:var(--sub);margin-top:5px}
  .flash{animation:flash .6s ease}
  @keyframes flash{0%{background:#fff7d6}100%{background:#fff}}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .panel{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
  .panel h3{margin:0 0 12px;font-size:14.5px}
  .board{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-top:14px}
  .board h3{margin:0 0 12px;font-size:14.5px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .row{display:flex;align-items:center;gap:10px}
  .spread{justify-content:space-between}
  .muted{color:var(--sub);font-size:12.5px}
  .up{color:var(--up);font-weight:600}
  .down{color:var(--down);font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--sub);font-weight:500;font-size:12px;background:#fafbfe}
  tbody tr:hover{background:#f8fafd}
  .num{font-variant-numeric:tabular-nums}
  .act{display:flex;gap:5px;justify-content:flex-end}
  .act button{padding:3px 9px;font-size:11.5px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:.12s}
  .act button:hover{filter:brightness(.95)}
  .act button.b{color:#c0392b;border-color:#f3c9c3}
  .act button.s{color:#1c7a4b;border-color:#bde5cd}
  .act button.d{color:#c0651a;border-color:#f3d9b8}
  .acard{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}
  .acard .head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;background:#eef2f8;color:var(--sub)}
  .badge.stock{background:#e8f0fe;color:#1a56db}
  .badge.fund{background:#fdf0e4;color:#c0651a}
  .badge.wealth{background:#e9f7ef;color:#1c7a4b}
  .badge.bond{background:#f0ecfd;color:#5b46c9}
  .badge.USD{background:#e8fbf9;color:#0e8a7d}
  .badge.CNY{background:#f5f5f5;color:#666}
  .badge.CN{background:#fdece9;color:#c0392b}
  .badge.US{background:#e8f0fe;color:#1a56db}
  .badge.acc{background:#eef2f8;color:#455468}
  .acard .metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
  .metric .k{font-size:11px;color:var(--sub)}
  .metric .v{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px}
  .legend{font-size:11.5px;color:var(--sub);margin-top:8px;line-height:1.6}
  .bars{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px;overflow-x:auto}
  .barwrap{display:flex;flex-direction:column;align-items:center;min-width:52px;flex:1}
  .bar{width:26px;border-radius:5px 5px 0 0;background:var(--accent);transition:.3s}
  .bar.neg{background:var(--down)}
  .barlab{font-size:10.5px;color:var(--sub);margin-top:6px;white-space:nowrap}
  .barval{font-size:10px;color:var(--sub)}
  .dist{display:flex;height:14px;border-radius:8px;overflow:hidden;margin:8px 0 10px}
  .dist i{display:block;height:100%}
  .mask{position:fixed;inset:0;background:rgba(18,28,50,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:540px;max-height:90vh;overflow:auto;padding:20px}
  .modal h3{margin:0 0 16px;font-size:16px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px}
  .field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit;background:#fbfcfe}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);background:#fff}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hint{font-size:11.5px;color:var(--sub);margin-top:5px;line-height:1.5}
  .hint.warn{color:#c0392b}
  .modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .empty{text-align:center;padding:40px 10px;color:var(--sub)}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#22314d;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;opacity:0;transition:.25s;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .filters select,.filters input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;background:#fff}
  .tag{font-size:10.5px;padding:1px 6px;border-radius:6px;background:#fdece9;color:#c0392b;margin-left:5px}
  .segmented{display:inline-flex;background:#eef2f8;border-radius:9px;padding:3px;gap:2px}
  .segmented button{border:none;background:transparent;padding:6px 13px;border-radius:7px;font-size:12.5px;cursor:pointer;color:var(--sub)}
  .segmented button.on{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .switch{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:11px;margin-bottom:11px;cursor:pointer;background:#fbfcfe}
  .switch .txt{flex:1}
  .switch .txt b{font-size:13.5px}
  .switch .txt div{font-size:11.5px;color:var(--sub);margin-top:3px}
  .toggle{width:46px;height:26px;border-radius:20px;background:#cfd8e5;position:relative;transition:.2s;flex:none}
  .toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .toggle.on{background:var(--accent)}
  .toggle.on::after{left:23px}
  .optlist{display:flex;gap:10px;flex-wrap:wrap}
  .opt{flex:1;min-width:180px;border:1.5px solid var(--line);border-radius:11px;padding:13px;cursor:pointer;background:#fff;transition:.15s}
  .opt.on{border-color:var(--accent);background:#f0fbfc}
  .opt b{font-size:13.5px;display:block;margin-bottom:4px}
  .opt div{font-size:11.5px;color:var(--sub);line-height:1.5}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.acard .metrics{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="logo">投资管家 <span>Investment Manager v3</span></div>
    <div class="fxpill">基准货币 <b>¥ CNY</b> | 1 USD = <b id="topFx">-</b> CNY</div>
    <div class="topbtns">
      <button class="btn ghost" onclick="openFx()">汇率管理</button>
      <button class="btn ghost" onclick="exportJSON()">导出</button>
      <button class="btn ghost" onclick="document.getElementById('imp').click()">导入</button>
      <button class="btn ghost" onclick="openAccount()">+ 账户</button>
      <button class="btn primary" onclick="openAsset()">+ 新增投资</button>
      <input id="imp" type="file" accept=".json" style="display:none" onchange="importJSON(event)">
    </div>
  </div>

  <div class="kpis" id="kpis"></div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================ 常量 ============================ */
const KEY='invest_manager_v3';
const TYPES={stock:'股票',fund:'基金',wealth:'理财',bond:'债券'};
const MARKETS={CN:'A股',US:'美股'};
const ACCKIND={broker:'券商',bank:'银行',other:'其他'};
const STK_SIDE={buy:'买入',sell:'卖出',div:'现金分红',bonus:'送股/转股',split:'拆分'};
const FLOW_KIND={invest:'投入',redeem:'赎回',income:'分红/利息'};
const TODAY=()=>new Date().toISOString().slice(0,10);
const MONTH=()=>TODAY().slice(0,7);
const uid=p=>(p||'x')+Math.random().toString(36).slice(2,8);
const round2=n=>Math.round((+n||0)*100)/100;

/* ============================ 种子数据 ============================ */
function seed(){
  return {
    settings:{costMethod:'wavg',dividendReducesCost:false,
      fxSource:{enabled:true,provider:'frankfurter.app',providerName:'Frankfurter(欧洲央行数据)',fallback:'open.er-api.com',lastDate:'2026-09-21',lastRate:6.6954,lastFetched:'2026-09-22 08:05',manualTakesPriority:true}},
    fx:[{date:'2026-01-01',rate:7.10,note:'初始汇率',source:'manual'},{date:'2026-06-01',rate:7.28,note:'年中调整',source:'manual'},
        {date:'2026-09-21',rate:6.6954,note:'自动同步',source:'auto'}],
    accounts:[
      {id:'acc1',name:'华泰证券',kind:'broker',currency:'CNY',note:'A股主账户'},
      {id:'acc2',name:'招商银行',kind:'bank',currency:'CNY',note:'理财/债券'},
      {id:'acc3',name:'富途证券',kind:'broker',currency:'USD',note:'美股账户'}
    ],
    assets:[
      {id:'a1',accountId:'acc1',name:'贵州茅台',code:'600519',market:'CN',type:'stock',currency:'CNY',price:1330},
      {id:'a2',accountId:'acc2',name:'宁德时代',code:'300750',market:'CN',type:'stock',currency:'CNY',price:210},
      {id:'a3',accountId:'acc3',name:'标普500 ETF',code:'VOO',market:'US',type:'fund',currency:'USD',price:0,marketValue:8600},
      {id:'a4',accountId:'acc2',name:'招银理财·稳健',code:'',market:'',type:'wealth',currency:'CNY',price:0,marketValue:51000},
      {id:'a5',accountId:'acc2',name:'国债2401',code:'',market:'',type:'bond',currency:'CNY',price:0,marketValue:20300}
    ],
    events:[
      {id:uid('e'),assetId:'a1',date:'2026-02-10',kind:'buy',side:'buy',qty:100,price:1500,fee:15,fx:1,note:'建仓'},
      {id:uid('e'),assetId:'a1',date:'2026-03-12',kind:'buy',side:'buy',qty:100,price:1450,fee:15,fx:1,note:'补仓'},
      {id:uid('e'),assetId:'a1',date:'2026-03-20',kind:'sell',side:'sell',qty:100,price:1560,fee:17,fx:1,isT:1,note:'T出'},
      {id:uid('e'),assetId:'a1',date:'2026-06-30',kind:'div',side:'div',amount:300,fx:1,note:'现金分红'},
      {id:uid('e'),assetId:'a1',date:'2026-07-10',kind:'bonus',side:'bonus',qty:20,fx:1,note:'10送2'},
      {id:uid('e'),assetId:'a1',date:'2026-08-15',kind:'buy',side:'buy',qty:100,price:1400,fee:15,fx:1,note:'回调买入'},
      {id:uid('e'),assetId:'a2',date:'2026-05-08',kind:'buy',side:'buy',qty:200,price:180,fee:20,fx:1,note:'买入'},
      {id:uid('e'),assetId:'a3',date:'2026-01-15',kind:'invest',amount:5000,fee:0,fx:7.10,note:'美股权重'},
      {id:uid('e'),assetId:'a3',date:'2026-07-15',kind:'invest',amount:3000,fee:0,fx:7.28,note:'加仓'},
      {id:uid('e'),assetId:'a3',date:'2026-08-01',kind:'income',amount:60,fee:0,fx:7.28,note:'分红'},
      {id:uid('e'),assetId:'a4',date:'2026-01-20',kind:'invest',amount:50000,fee:0,fx:1,note:''},
      {id:uid('e'),assetId:'a4',date:'2026-06-20',kind:'income',amount:1200,fee:0,fx:1,note:'半年利息'},
      {id:uid('e'),assetId:'a5',date:'2026-04-01',kind:'invest',amount:20000,fee:0,fx:1,note:''}
    ],
    snapshots:[
      {month:'2026-01',total:86000},{month:'2026-02',total:237000},{month:'2026-03',total:236500},
      {month:'2026-04',total:246000},{month:'2026-05',total:289000},{month:'2026-06',total:291500},
      {month:'2026-07',total:314500},{month:'2026-08',total:520000}
    ],
    cashFlows:[
      {id:uid('c'),accountId:'acc1',date:'2026-02-01',kind:'deposit',amount:300000,fx:1,note:'券商入金'},
      {id:uid('c'),accountId:'acc2',date:'2026-01-15',kind:'deposit',amount:90000,fx:1,note:'银行入金'},
      {id:uid('c'),accountId:'acc2',date:'2026-05-01',kind:'withdraw',amount:20000,fx:1,note:'取现'},
      {id:uid('c'),accountId:'acc3',date:'2026-01-10',kind:'deposit',amount:8000,fx:7.10,note:'美元入金'}
    ],
    benchSeries:[
      {date:'2026-01',value:3800},{date:'2026-02',value:3920},{date:'2026-03',value:3860},
      {date:'2026-04',value:4010},{date:'2026-05',value:4180},{date:'2026-06',value:4090},
      {date:'2026-07',value:4260},{date:'2026-08',value:4430}
    ],
    taxRules:{cnDiv:{le1m:0.20,m1to1y:0.10,gt1y:0},cnCapGain:0,usDiv:0.30,usCapGain:0.15},
    dcaPlans:[{id:uid('d'),assetId:'a3',startMonth:'2026-09',months:12,day:15,amount:400,note:'标普500月定投',active:true}]
  };
}
function load(){ try{const r=localStorage.getItem(KEY); if(r)return JSON.parse(r);}catch(e){} return seed(); }
function save(s){ S=s||S; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
let S = load(); save(S);

/* ============================ 计算引擎(与 server/calc.js 同源) ============================ */
function currentFx(S){ const t=TODAY();
  // 同一日期:管理员手动录入(source=manual)优先于自动汇率(source=auto)
  const f=S.fx.filter(r=>r.date<=t).sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:((a.source==='manual'?1:0)-(b.source==='manual'?1:0))));
  return f.length?f[f.length-1].rate:7.1; }
const assetFx=(a,S)=> a.currency==='USD'?currentFx(S):1;
function eventsOf(S,aid){ return S.events.filter(e=>e.assetId===aid).sort((x,y)=>x.date<y.date?-1:(x.date>y.date?1:0)); }
function cfgOf(S){ return {costMethod:'wavg',dividendReducesCost:false,...(S.settings||{})}; }

function calcAsset(a,S){
  const cfg=cfgOf(S), evs=eventsOf(S,a.id);
  return a.type==='stock'?calcStock(a,evs,cfg,S):calcFlow(a,evs,S);
}
function calcStock(a,evs,cfg,S){
  const isFifo=cfg.costMethod==='fifo', divReduce=!!cfg.dividendReducesCost;
  let qty=0, lots=[], costLocal=0, costCNY=0, buyQty=0, buyAmtCNY=0, buyAmtLocal=0, realLocal=0, realCNY=0, divLocal=0, divCNY=0;
  const byMonth={}; const addM=(m,k,v)=>{ if(!m)return; byMonth[m]=byMonth[m]||{sell:0,div:0}; byMonth[m][k]=round2(byMonth[m][k]+v); };
  let realizedCostCNY=0; // FIFO 已结转成本
  for(const t of evs){
    const f=t.fx||1;
    if(t.side==='buy'){
      const g=t.qty*t.price; qty+=t.qty; costLocal+=g+(t.fee||0); costCNY+=(g+(t.fee||0))*f;
      lots.push({q:t.qty,price:t.price,fee:t.fee||0,fx:f}); buyQty+=t.qty; buyAmtCNY+=(g+(t.fee||0))*f; buyAmtLocal+=g+(t.fee||0);
    } else if(t.side==='sell'){
      const sellQty=t.qty, fee=t.fee||0;
      let rl=0, rc=0;
      if(isFifo){
        let need=sellQty;
        while(need>1e-9 && lots.length){
          const lot=lots[0]; const take=Math.min(need,lot.q);
          const uL=lot.price+(lot.fee||0)/lot.q, uC=uL*lot.fx;
          rl+=t.price*take-uL*take; rc+=t.price*take*f-uC*take;
          lot.q-=take; need-=take; if(lot.q<=1e-9)lots.shift();
        }
        rl-=fee; rc-=fee*f;
        costLocal=lots.reduce((s,l)=>s+l.q*(l.price+(l.fee||0)/l.q),0);
        costCNY=lots.reduce((s,l)=>s+l.q*((l.price+(l.fee||0)/l.q)*l.fx),0);
        qty-=sellQty;
      } else {
        const avgL=qty>0?costLocal/qty:0, avgC=qty>0?costCNY/qty:0;
        rl=t.qty*t.price-fee-avgL*sellQty; rc=(t.qty*t.price-fee)*f-avgC*sellQty;
        costLocal-=avgL*sellQty; costCNY-=avgC*sellQty; qty-=sellQty;
      }
      realLocal+=rl; realCNY+=rc; addM(t.date.slice(0,7),'sell',rc);
    } else if(t.side==='div'){
      const v=(t.amount||0)*f;
      if(divReduce){ costLocal-=(t.amount||0); costCNY-=v; }
      else { divLocal+=(t.amount||0); divCNY+=v; addM(t.date.slice(0,7),'div',v); }
    } else if(t.side==='bonus'){
      const add=t.qty||0; qty+=add;
      if(isFifo){ if(lots.length)lots[lots.length-1].q+=add; else lots.push({q:add,price:0,fee:0,fx:f}); }
    } else if(t.side==='split'){
      const r=t.ratio||1; qty*=r;
      if(isFifo) lots.forEach(l=>{l.q*=r;l.price/=r;});
    }
  }
  const fxNow=assetFx(a,S), px=a.price||0, mvLocal=qty*px, mvCNY=mvLocal*(a.currency==='USD'?fxNow:1);
  const unrealCNY=mvCNY-costCNY, totalCNY=realCNY+divCNY+unrealCNY;
  return {type:'stock',qty:+qty.toFixed(6),costLocal:round2(costLocal),costCNY:round2(costCNY),
    mvLocal:round2(mvLocal),mvCNY:round2(mvCNY),realLocal:round2(realLocal),realCNY:round2(realCNY),
    divCNY:round2(divCNY),unrealCNY:round2(unrealCNY),totalCNY:round2(totalCNY),
    avgLocal:qty>0?costLocal/qty:0, avgCNY:qty>0?costCNY/qty:0,
    buyAvgCNY:buyQty>0?buyAmtCNY/buyQty:0, buyAvgLocal:buyQty>0?buyAmtLocal/buyQty:0, buyQty, buyAmtCNY:round2(buyAmtCNY), buyAmtLocal:round2(buyAmtLocal),
    rate:buyAmtCNY>0?totalCNY/buyAmtCNY:0, fxUsed:fxNow, byMonth};
}
function calcFlow(a,evs,S){
  let investCNY=0,redeemCNY=0,incomeCNY=0;
  for(const f of evs){ const v=(f.amount||0)*(f.fx||1);
    if(f.kind==='invest')investCNY+=v; else if(f.kind==='redeem')redeemCNY+=v; else if(f.kind==='income')incomeCNY+=v; }

function xirr(flows,guess){
  if(!flows||flows.length<2)return null;
  const t0=new Date(flows[0].date).getTime(), yrs=d=>(new Date(d).getTime()-t0)/31536000000;
  const npv=r=>flows.reduce((s,f)=>s+f.amount/Math.pow(1+r,yrs(f.date)),0);
  let r=guess==null?0.1:guess;
  for(let i=0;i<100;i++){ const f=npv(r); if(Math.abs(f)<1e-6)return r;
    const df=(npv(r+1e-7)-f)/1e-7; if(!isFinite(df)||Math.abs(df)<1e-12)break;
    const next=r-f/df; if(!isFinite(next))break; if(Math.abs(next-r)<1e-10)return next; r=Math.max(-0.9999,Math.min(100,next)); }
  let lo=-0.9999,hi=100,flo=npv(lo),fhi=npv(hi);
  if(!isFinite(flo)||!isFinite(fhi)||flo*fhi>0)return null;
  for(let i=0;i<300;i++){ const mid=(lo+hi)/2,fm=npv(mid); if(Math.abs(fm)<1e-6||(hi-lo)<1e-12)return mid; if(flo*fm<0){hi=mid;fhi=fm;}else{lo=mid;flo=fm;} }
  return (lo+hi)/2; }
function portfolioFlows(S,opts){ const accountId=opts&&opts.accountId, asOf=(opts&&opts.asOf)||TODAY(); const flows=[];
  S.assets.filter(a=>!accountId||a.accountId===accountId).forEach(a=>{ eventsOf(S,a.id).forEach(e=>{ const f=e.fx||1; let amt=0;
    if(a.type==='stock'){ if(e.side==='buy')amt=-((e.qty*e.price)+(e.fee||0))*f; else if(e.side==='sell')amt=((e.qty*e.price)-(e.fee||0))*f; else if(e.side==='div')amt=(e.amount||0)*f; }
    else { if(e.kind==='invest')amt=-((e.amount||0)+(e.fee||0))*f; else if(e.kind==='redeem')amt=(e.amount||0)*f; else if(e.kind==='income')amt=(e.amount||0)*f; }
    if(Math.abs(amt)>1e-9)flows.push({date:e.date,amount:amt,assetId:a.id}); }); });
  flows.sort((x,y)=>x.date<y.date?-1:(x.date>y.date?1:0));
  const mv=summary(S,opts).total; if(mv>0)flows.push({date:asOf,amount:mv,assetId:null,terminal:true});
  return flows; }
function portfolioXirr(S,opts){ const flows=portfolioFlows(S,opts); if(flows.length<2)return null;
  if(flows[0].amount>=0)flows.unshift({date:flows[0].date,amount:-1e-6}); return xirr(flows); }

  if(!first)return 0; return Math.max(1,Math.round((new Date(TODAY())-new Date(first))/86400000)); }
function twr(S,opts){ const rows=monthRows(S,opts).filter(r=>r.snap!==undefined); if(rows.length<2)return null; let factor=1;
  for(let i=1;i<rows.length;i++){ const denom=rows[i-1].snap+(rows[i].net||0); if(denom>0)factor*=rows[i].snap/denom; } return factor-1; }
const ALLOC_DEFAULT={stock:0.6,fund:0.2,wealth:0.15,bond:0.05};
function allocation(S,targets,opts){ const s=summary(S,opts), tg={...ALLOC_DEFAULT,...(targets||{})}; const byType={};
  s.rows.forEach(r=>{ byType[r.a.type]=(byType[r.a.type]||0)+r.mv; }); const total=s.total||0;
  const rows=['stock','fund','wealth','bond'].map(t=>{ const cur=byType[t]||0;

function viewTx(){
  const rows=[];
  for(const a of S.assets){ if(FILTER.acct!=='all'&&a.accountId!==FILTER.acct)continue;
    eventsOf(S,a.id).forEach(t=>{
      if(a.type==='stock'){ const sign=t.side==='buy'?-1:(t.side==='sell'?1:0);

        rows.push({date:t.date,asset:a,kind:STK_SIDE[t.side],amt:sign*(amt-(t.fee||0)),ccy:a.currency,fx:t.fx||1,note:t.note||''});
      } else rows.push({date:t.date,asset:a,kind:FLOW_KIND[t.kind],amt:(t.kind==='invest'?-1:1)*t.amount,ccy:a.currency,fx:t.fx||1,note:t.note||''});

  rows.sort((x,y)=>x.date<y.date?1:-1);
  if(!rows.length)return emptyState();

/* ---- 绩效 ---- */
function lineChart(series,keys,colors,labels){
  const all=series.flatMap(d=>keys.map(k=>d[k]).filter(v=>v!=null));
  const max=Math.max(...all,0.01), min=Math.min(...all,0); const H=150, W=Math.max(300,series.length*54);
  const y=v=>H-Math.round((v-min)/((max-min)||1)*H);
  const path=k=>series.map((d,i)=>d[k]==null?'':`${i===0?'M':'L'}${30+i*((W-40)/(Math.max(1,series.length-1)))},${y(d[k])}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H+34}" style="width:100%;max-width:${W}px;height:auto">
    <line x1="28" y1="${y(min)}" x2="${W-8}" y2="${y(min)}" stroke="#e4e8f0"/>
    ${keys.map((k,i)=>`<path d="${path(k)}" fill="none" stroke="${colors[i]}" stroke-width="2"/>`).join('')}
    ${series.map((d,i)=>`<text x="${30+i*((W-40)/(Math.max(1,series.length-1)))}" y="${H+16}" font-size="9" fill="#6b7688" text-anchor="middle">${(d.month||'').slice(5)}</text>`).join('')}
    ${labels.map((l,i)=>`<text x="${8+i*90}" y="${12+i*0}" font-size="0" fill="none"></text>`).join('')}
  </svg>`;
}

function savePlan(){ const assetId=gv('pl_asset'); if(!assetId)return toast('请选择资产');

function genPlan(id){ const p=(S.dcaPlans||[]).find(x=>x.id===id); if(!p)return;

  rows.forEach(r=>S.events.push({id:uid('e'),assetId:p.assetId,...r,note:(p.note||'定投')}));

function cmpRow(label,S2){ let real=0,unreal=0;
  S2.assets.filter(a=>a.type==='stock').forEach(a=>{const r=calcAsset(a,S2); real+=r.realCNY+r.divCNY; unreal+=r.unrealCNY;});
  return {label,real:round2(real),unreal:round2(unreal),total:round2(real+unreal)}; }
function renderCmp(){
  const el=document.getElementById('cmpBody'); if(!el)return;
  const base={...S,settings:{...cfgOf(S)}};
  const wavg={...base,settings:{...base.settings,costMethod:'wavg'}};
  const fifo={...base,settings:{...base.settings,costMethod:'fifo'}};
  const rows=[cmpRow('摊薄 · 分红计入收益',{...wavg,settings:{...wavg.settings,dividendReducesCost:false}}),
              cmpRow('摊薄 · 分红冲减成本',{...wavg,settings:{...wavg.settings,dividendReducesCost:true}}),
              cmpRow('FIFO · 分红计入收益',{...fifo,settings:{...fifo.settings,dividendReducesCost:false}}),
              cmpRow('FIFO · 分红冲减成本',{...fifo,settings:{...fifo.settings,dividendReducesCost:true}})];
  el.innerHTML=rows.map(r=>`<tr><td>${r.label}</td><td class="num ${fxColor(r.real)}">${money(r.real)}</td>
    <td class="num ${fxColor(r.unreal)}">${money(r.unreal)}</td><td class="num ${fxColor(r.total)}">${money(r.total)}</td></tr>`).join('');
}
function setCost(m){ S.settings.costMethod=m; save(); render(); toast('成本口径已切换为 '+(m==='fifo'?'FIFO':'摊薄')); }
function toggleDiv(){ S.settings.dividendReducesCost=!S.settings.dividendReducesCost; save(); render(); toast('分红处理:'+(S.settings.dividendReducesCost?'冲减成本':'计入收益')); }

      <div class="field"><label>${a&&a.type!=='stock'?'当前市值(原币)':'最新价(原币)'}</label>
        <input id="f_price" type="number" step="0.0001" value="${a?(a.type==='stock'?(a.price||0):(a.marketValue||0)):''}"></div></div>
    <div class="hint">${a?'类型、市场、币种、账户创建后不可修改(可删后重建)。':'股票按"交易"记录(含分红/送股/拆分);理财、债券、基金按"现金流"记录(投入/赎回/分红利息)。A股与美股的记录方式相同,仅市场标签与币种不同。'}</div>
    <div class="actions"><button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveAsset(${a?`'${a.id}'`:'null'})">保存</button></div>`);
}
function saveAsset(id){
  const name=gv('f_name'); if(!name)return toast('请填写名称');
  const price=parseFloat(gv('f_price'))||0;
  if(id){ const a=S.assets.find(x=>x.id===id); a.name=name; a.code=gv('f_code');
    if(a.type==='stock')a.price=price; else a.marketValue=price; }
  else{ const type=gv('f_type'), market=gv('f_market');
    S.assets.push({id:uid('a'),accountId:gv('f_acct'),name,code:gv('f_code'),market:type==='stock'?market:'',
      type,currency:gv('f_ccy'),price:type==='stock'?price:0,marketValue:type==='stock'?0:price});
    TAB='hold'; }
  save();closeModal();render();toast('已保存');
}
function delAsset(id){ if(!confirm('删除该资产及全部记录?'))return;
  S.assets=S.assets.filter(a=>a.id!==id); S.events=S.events.filter(e=>e.assetId!==id); save();render();toast('已删除'); }
function editPrice(id){ const a=S.assets.find(x=>x.id===id), stk=a.type==='stock';
  show(`<h3>更新${stk?'最新价':'当前市值'}</h3>
    <div class="field"><label>${stk?'最新价('+a.currency+')':'当前市值('+a.currency+')'}</label>
      <input id="p_v" type="number" step="0.0001" value="${stk?(a.price||0):(a.marketValue||0)}"></div>
    <div class="hint">市值/最新价不受历史汇率影响;估值统一按最新汇率折算。</div>
    <div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="savePrice('${id}')">保存</button></div>`);
}
function savePrice(id){ const a=S.assets.find(x=>x.id===id), v=parseFloat(gv('p_v'))||0;
  if(a.type==='stock')a.price=v; else a.marketValue=v; save();closeModal();render();toast('已更新'); }

function openTrade(id,preset){
  const a=S.assets.find(x=>x.id===id), stk=a.type==='stock';
  const opts=stk?[['buy','买入'],['sell','卖出'],['div','现金分红'],['bonus','送股/转股'],['split','拆分']]
                :[['invest','投入'],['redeem','赎回'],['income','分红/利息']];
  const cur=preset&&opts.some(o=>o[0]===preset)?preset:opts[0][0];
  window.__cur={id,stk,type:cur,ccy:a.currency};
  show(`<h3>${a.name} · 记录 <span class="badge acc">${accName(a.accountId)}</span></h3>
    <div class="f2">
      <div class="field"><label>日期 *</label><input id="t_date" type="date" value="${TODAY()}"></div>
      <div class="field"><label>类型 *</label><select id="t_type" onchange="trType(this.value)">${opts.map(([k,n])=>`<option value="${k}" ${cur===k?'selected':''}>${n}</option>`).join('')}</select></div></div>
    <div id="trFields"></div>
    <div class="field"><label>备注</label><input id="t_note" placeholder="选填"></div>
    <div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveTrade('${id}')">保存</button></div>`);
  trType(cur);
}
function trFieldsHTML(){
  const {type,ccy}=window.__cur;
  const fxField=`<div class="field"><label>汇率(1 USD = ? CNY)← 锁定到本笔</label><input id="t_fx" type="number" step="0.0001" value="${ccy==='USD'?currentFx(S):1}" ${ccy==='CNY'?'disabled':''}></div>`;
  if(type==='buy'||type==='sell')
    return `<div class="f2"><div class="field"><label>数量(股)*</label><input id="t_qty" type="number" step="1"></div>
      <div class="field"><label>成交价(${ccy})*</label><input id="t_price" type="number" step="0.0001"></div></div>
      <div class="field"><label>手续费/佣金(含印花税、过户费)</label><input id="t_fee" type="number" step="0.01" value="0"></div>
      ${fxField}<div class="field"><label><input type="checkbox" id="t_isT" style="width:auto"> 标记为做 T 交易(仅统计用)</label></div>`;
  if(type==='div') return `<div class="field"><label>现金分红总额(${ccy})*</label><input id="t_amount" type="number" step="0.01"></div>${fxField}
      <div class="hint">${cfgOf(S).dividendReducesCost?'当前设置:分红<b>冲减成本</b>(不改已实现)。':'当前设置:分红<b>计入已实现收益</b>(不改成本)。'}</div>`;
  if(type==='bonus') return `<div class="field"><label>送股/转股数量(股)*</label><input id="t_qty" type="number" step="1"></div>${fxField}
      <div class="hint">送股不花成本:股数增加、成本总额不变 → 摊薄成本自动下降。</div>`;
  if(type==='split') return `<div class="field"><label>拆分比例(1 股 → N 股)*</label><input id="t_ratio" type="number" step="0.0001" value="2"></div>${fxField}
      <div class="hint">拆股后 股数 × 比例,成本总额不变;填 0.5 表示合股。</div>`;
  const isInvest=type==='invest';
  return `<div class="field"><label>金额(${ccy})*</label><input id="t_amount" type="number" step="0.01"></div>
    ${isInvest?`<div class="field"><label>手续费</label><input id="t_fee" type="number" step="0.01" value="0"></div>`:''}${fxField}`;
}
function trType(v){ if(window.__cur){ window.__cur.type=v; document.getElementById('trFields').innerHTML=trFieldsHTML(); } }
function saveTrade(id){
  const a=S.assets.find(x=>x.id===id), {stk,type}=window.__cur;
  const date=gv('t_date'), note=gv('t_note');
  const fxEl=document.getElementById('t_fx'), fx=fxEl?(parseFloat(fxEl.value)||1):1;
  const fee=parseFloat(gv('t_fee'))||0;
  const e={id:uid('e'),assetId:id,date,note,fx};
  if(stk){
    if(type==='buy'||type==='sell'){ const qty=parseFloat(gv('t_qty'))||0, price=parseFloat(gv('t_price'))||0;
      if(qty<=0||price<=0)return toast('数量与成交价需大于0');
      Object.assign(e,{kind:type,side:type,qty,price,fee,isT:document.getElementById('t_isT').checked?1:0}); }
    else if(type==='div'){ const amount=parseFloat(gv('t_amount'))||0; if(amount<=0)return toast('分红金额需大于0'); Object.assign(e,{kind:'div',side:'div',amount}); }
    else if(type==='bonus'){ const qty=parseFloat(gv('t_qty'))||0; if(qty<=0)return toast('送股数量需大于0'); Object.assign(e,{kind:'bonus',side:'bonus',qty}); }
    else if(type==='split'){ const ratio=parseFloat(gv('t_ratio'))||0; if(ratio<=0)return toast('拆分比例需大于0'); Object.assign(e,{kind:'split',side:'split',ratio}); }
  } else { const amt=parseFloat(gv('t_amount'))||0; if(amt<=0)return toast('金额需大于0'); Object.assign(e,{kind:type,amount:amt,fee}); }
  S.events.push(e); save();
  if(stk&&(type==='div'||type==='bonus'||type==='split')){
    const hint= type==='div' ? `「${a.name}」已记录现金分红。现金分红通常伴随<b>除息</b>(股价会相应下调),请同步更新最新价。`
      : type==='bonus' ? `「${a.name}」已记录送股/转股。送股通常伴随<b>除权</b>(股价会被摊薄),请同步更新最新价。`
      : `「${a.name}」已记录拆分/合股。总市值不变但每股价格按比例变化,请同步更新最新价。`;
    __postPrompt={id,name:a.name,hint};
  }
  closeModal();render();
  if(__postPrompt) showPostPrompt();
  else toast('已记录');
}
function showPostPrompt(){
  const p=__postPrompt; if(!p)return; const a=S.assets.find(x=>x.id===p.id); if(!a){__postPrompt=null;return;}
  const stk=a.type==='stock';
  show(`<h3>⚠ 提醒:请同步最新价</h3>
    <div class="switch" style="cursor:default"><div class="txt"><div style="font-size:12.5px;color:var(--txt);line-height:1.6">${p.hint}</div></div></div>
    <div class="field"><label>${stk?'最新价('+a.currency+')':'当前市值('+a.currency+')'}</label>
      <input id="pp_v" type="number" step="0.0001" value="${stk?(a.price||0):(a.marketValue||0)}"></div>
    <div class="hint">及时更新现价,浮动盈亏才真实;不更新也可以稍后再在持仓卡片点「改现价」录入。</div>
    <div class="actions"><button class="btn" onclick="__postPrompt=null;closeModal()">稍后</button>
      <button class="btn primary" onclick="savePostPrice()">保存现价</button></div>`);
}
function savePostPrice(){ const p=__postPrompt; if(!p)return; const a=S.assets.find(x=>x.id===p.id);
  const v=parseFloat(gv('pp_v')); if(!(v>=0))return toast('请填写有效价格');
  if(a.type==='stock')a.price=v; else a.marketValue=v;
  __postPrompt=null; save();closeModal();render();toast('已记录,现价已更新'); }
function delEvent(eid){ S.events=S.events.filter(e=>e.id!==eid); save();render();toast('已删除'); }

function openFx(){ show(`<h3>新增汇率</h3>
    <div class="f2"><div class="field"><label>生效日期 *</label><input id="x_date" type="date" value="${TODAY()}"></div>
      <div class="field"><label>1 USD = ? CNY *</label><input id="x_rate" type="number" step="0.0001" value="${currentFx(S)}"></div></div>
    <div class="field"><label>备注</label><input id="x_note" placeholder="选填"></div>
    <div class="hint warn">⚠ 新增汇率只作为"此后新记录"的默认值,不会回改任何历史记录的成本。</div>
    <div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveFx()">保存</button></div>`); }
function saveFx(){ const date=gv('x_date'),rate=parseFloat(gv('x_rate')); if(!(rate>0))return toast('汇率需大于0');
  S.fx=S.fx.filter(f=>!(f.date===date&&f.source==='manual'));
  S.fx.push({date,rate,note:gv('x_note'),source:'manual'});
  S.fx.sort((a,b)=>a.date<b.date?-1:1);
  save();closeModal();render();toast('手动汇率已录入(优先于自动源,仅影响后续记录)'); }
function syncFx(){ // 原型:模拟拉取汇率源(正式版由后端定时拉取)
  const fs=cfgOf(S).fxSource||{};
  const demo=6.7+Math.round(Math.random()*40)/1000;   // 模拟波动
  const t=TODAY();
  S.fx=S.fx.filter(f=>!(f.date===t&&f.source==='auto'));
  S.fx.push({date:t,rate:demo,note:'自动同步',source:'auto'});
  S.fx.sort((a,b)=>a.date<b.date?-1:1);
  S.settings.fxSource={...fs,lastDate:t,lastRate:demo,lastFetched:new Date().toISOString().slice(0,16).replace('T',' ')};
  save();render();toast('已同步:1 USD = ¥'+demo.toFixed(4)+'(管理员手动优先)'); }
function delFx(d){ S.fx=S.fx.filter(f=>!(f.date===d&&f.source==='manual')); save();render();toast('已删除'); }

function addSnap(){ const m=gv('snapM'),v=parseFloat(gv('snapV')); if(!m||!(v>=0))return toast('请填写月份与金额');
  S.snapshots=S.snapshots.filter(s=>s.month!==m); S.snapshots.push({month:m,total:v}); S.snapshots.sort((a,b)=>a.month<b.month?-1:1);
  save();render();toast('快照已保存'); }
function delSnap(m){ S.snapshots=S.snapshots.filter(s=>s.month!==m); save();render();toast('已删除'); }

function exportJSON(){ const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b), a=document.createElement('a'); a.href=u; a.download='投资管家备份_'+TODAY()+'.json'; a.click(); URL.revokeObjectURL(u); toast('已导出'); }
function importJSON(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ const j=JSON.parse(r.result); if(!j.assets||!j.fx)throw 0; S=j; save(S); render(); toast('导入成功'); }catch(x){ toast('文件格式不正确'); } };
  r.readAsText(f); e.target.value=''; }
function resetAll(){ if(!confirm('清空全部数据并恢复示例?'))return; S=seed(); save(S); render(); toast('已重置'); }

render();
setTimeout(renderCmp,0);
</script>
</body>
</html>
